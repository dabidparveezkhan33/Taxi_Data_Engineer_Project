<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8f4ff">
  <meta name="description" content="Your ride booking is confirmed.">
  <title>Ride Confirmed — Ride Booking</title>
  <style>
    :root{--navy:#10243f;--muted:#6c7f98;--teal:#108a78;--teal-dark:#08796b}
    *{box-sizing:border-box}body{min-height:100vh;min-height:100svh;margin:0;padding:32px;display:grid;place-items:center;background:linear-gradient(145deg,#dcefff 0%,#eaf5ff 48%,#f4f8fc 100%);color:var(--navy);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.card{width:min(100%,760px);padding:58px 64px 52px;text-align:center;background:#fff;border:1px solid #eaf0f5;border-radius:36px;box-shadow:0 24px 65px #17395d1c;animation:enter .55s ease both}.success{width:112px;height:112px;margin:0 auto 28px;display:grid;place-items:center;border-radius:50%;background:#e1f5f2}.success-inner{width:84px;height:84px;display:grid;place-items:center;border-radius:50%;background:var(--teal);box-shadow:0 10px 24px #108a7830}.success svg{width:43px;height:43px}h1{margin:0 0 14px;font-size:clamp(34px,5vw,48px);line-height:1.13;letter-spacing:-.055em;font-weight:760}.message{max-width:550px;margin:0 auto 39px;color:var(--muted);font-size:clamp(17px,2.2vw,22px);line-height:1.6}.actions{display:grid;justify-items:center;gap:20px}.button{min-height:59px;min-width:226px;padding:0 30px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--teal);color:#fff;text-decoration:none;font-size:17px;font-weight:700;box-shadow:0 11px 24px #108a7833;transition:background .18s,transform .18s,box-shadow .18s}.button:hover{background:var(--teal-dark);transform:translateY(-2px);box-shadow:0 14px 28px #108a7840}.secondary{color:var(--muted);font-size:16px;text-underline-offset:4px;transition:color .18s}.secondary:hover{color:var(--teal-dark)}a:focus-visible{outline:3px solid #39b8a7;outline-offset:4px;border-radius:7px}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){body{padding:20px}.card{padding:42px 23px 36px;border-radius:27px}.success{width:96px;height:96px;margin-bottom:24px}.success-inner{width:72px;height:72px}.success svg{width:37px;height:37px}.message{margin-bottom:30px}.button{min-width:210px;min-height:55px;font-size:16px}.secondary{font-size:15px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="confirmation-title">
    <div class="success" aria-hidden="true"><div class="success-inner"><svg viewBox="0 0 48 48" fill="none"><path d="m12 24 8 8 17-18" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
    <h1 id="confirmation-title">Ride Confirmed</h1>
    <p class="message">Your ride has been successfully booked. Thank you for choosing our service!</p>
    <div class="actions">
      <a class="button" href="/">Back to home</a>
      
    </div>
  </main>
</body>
</html>
